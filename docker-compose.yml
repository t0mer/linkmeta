services:
  linkmeta:
    image: techblog/linkmeta:latest
    build:
      context: .
      args:
        VERSION: dev
    ports:
      - "8080:8080"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b-instruct
      OLLAMA_KEEP_ALIVE: 24h
      LLM_TIMEOUT: 180s
      FETCH_TIMEOUT: 20s
      LOG_LEVEL: info
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  ollama-models:
